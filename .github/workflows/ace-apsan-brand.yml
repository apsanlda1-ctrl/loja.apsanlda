# ACE APSAN branding v4
name: Aplicar identidade ACE APSAN

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/ace-apsan-logo.svg'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar identidade e simplificar rodape
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Mantem o logo ACE APSAN no cabecalho e a identidade geral.
          replacements = {
            '<title>APSAN, LDA. - Soluções Integradas</title>': '<title>ACE APSAN — Angola Comunidade Educativa APSAN</title>',
            'aria-label="APSAN, LDA. - Início"': 'aria-label="ACE APSAN — Início"',
            '<span class="lp-logo-mark"><i class="fa-solid fa-cube"></i></span>\n        <span><strong>APSAN</strong><small>, LDA.</small></span>': '<img src="assets/ace-apsan-logo.svg" alt="ACE APSAN — Angola Comunidade Educativa APSAN" class="ace-site-logo">',
            '<div><span>APSAN, LDA.</span><small>Acesso rápido à plataforma</small></div>': '<div><span>ACE APSAN</span><small>Angola Comunidade Educativa</small></div>',
            '<span><i class="fa-solid fa-flag"></i> APSAN, LDA. — Angola</span>': '<span><i class="fa-solid fa-graduation-cap"></i> ACE APSAN — Angola Comunidade Educativa</span>',
            '<span class="lp-dash-brand"><i class="fa-solid fa-layer-group" style="color:#6d28d9"></i> APSAN, LDA. · Portal digital</span>': '<span class="lp-dash-brand"><i class="fa-solid fa-graduation-cap" style="color:#d79b18"></i> ACE APSAN · Portal Educativo e Marketplace</span>'
          }
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new, 1)

          # Rodape final: remover completamente o carimbo, slogan e lista de categorias.
          footer = '''<footer class="ace-simple-footer">
            <div class="ace-footer-nif">Angola · Cunene · NIF: 500208501</div>
            <div class="ace-footer-rights">© 2026 APSAN, LDA. Todos os direitos reservados.</div>
          </footer>'''
          s, count = re.subn(r'<footer\b[^>]*>.*?</footer>', footer, s, count=1, flags=re.I | re.S)
          if count == 0:
            raise SystemExit('Rodape nao encontrado.')

          style = '''\n<style id="ace-apsan-logo-style">\n.ace-site-logo{width:min(300px,28vw);height:auto;display:block;max-height:58px;object-fit:contain;object-position:left center}\n.ace-simple-footer{padding:30px 24px!important;text-align:center;background:#05070d;color:#94a3b8;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px;align-items:center}\n.ace-footer-nif{font-size:.95rem;color:#cbd5e1;font-weight:600}\n.ace-footer-rights{font-size:.85rem;color:#64748b}\n@media(max-width:800px){.ace-site-logo{width:190px;max-width:58vw;max-height:50px}.ace-simple-footer{padding:25px 16px!important}.ace-footer-nif{font-size:.82rem}.ace-footer-rights{font-size:.76rem}}\n</style>\n'''
          if 'id="ace-apsan-logo-style"' not in s:
            s = s.replace('</head>', style + '</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "fix: simplificar rodape ACE APSAN"
          git push

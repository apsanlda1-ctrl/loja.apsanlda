# ACE APSAN branding v7
name: Aplicar identidade ACE APSAN

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/ace-apsan-logo.svg'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar rodape e logo do cabecalho
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Cabecalho: somente o logo passa a ter formato quadrado.
          # O arquivo SVG original continua sendo usado no rodape sem alteracao.
          style = '''\n<style id="ace-apsan-v7-style">\n.ace-site-logo{width:76px!important;height:58px!important;max-width:none!important;max-height:none!important;object-fit:cover!important;object-position:center!important;border-radius:10px!important;display:block!important}\n.ace-simple-footer{width:100%!important;box-sizing:border-box!important;text-align:center!important;align-items:center!important;justify-content:center!important}\n.ace-footer-nif,.ace-footer-rights{width:100%!important;text-align:center!important;display:block!important;margin-left:auto!important;margin-right:auto!important}\n@media(max-width:800px){.ace-site-logo{width:58px!important;height:50px!important;border-radius:9px!important}.ace-simple-footer{text-align:center!important;align-items:center!important}}\n</style>\n'''
          if 'id="ace-apsan-v7-style"' not in s:
            s = s.replace('</head>', style + '</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "style: centralizar rodape e ajustar logo do cabecalho"
          git push

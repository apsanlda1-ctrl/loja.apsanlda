# ACE APSAN branding v2
name: Aplicar identidade ACE APSAN

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/ace-apsan-logo.svg'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar logo e aplicar marca
        shell: python
        run: |
          from pathlib import Path

          Path('assets').mkdir(exist_ok=True)
          svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
          <title id="title">ACE APSAN — Angola Comunidade Educativa APSAN</title>
          <desc id="desc">Logo institucional com educação, comunidade, música e marketplace.</desc>
          <defs>
            <linearGradient id="navy" x1="0" x2="1"><stop stop-color="#06264d"/><stop offset="1" stop-color="#0d5aa7"/></linearGradient>
            <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#d79b18"/><stop offset="1" stop-color="#f5c64b"/></linearGradient>
          </defs>
          <rect width="760" height="220" rx="28" fill="#07111f"/>
          <g transform="translate(24 22)">
            <path d="M104 16 188 48 104 80 20 48Z" fill="url(#navy)" stroke="url(#gold)" stroke-width="5"/>
            <path d="M55 70h98v44H55z" fill="#fff" opacity=".98"/>
            <path d="M47 75h114" stroke="#d79b18" stroke-width="8"/>
            <path d="M104 114v35" stroke="#d79b18" stroke-width="7" stroke-linecap="round"/>
            <circle cx="104" cy="154" r="8" fill="#f5c64b"/>
            <path d="M28 112 104 145l76-33-76 68Z" fill="#fff" stroke="#0d5aa7" stroke-width="5"/>
            <path d="M104 145v35" stroke="#0d5aa7" stroke-width="5"/>
            <circle cx="27" cy="58" r="13" fill="#f5c64b"/><circle cx="181" cy="58" r="13" fill="#f5c64b"/>
            <path d="M27 58c20 17 36 25 55 28M181 58c-20 17-36 25-55 28" fill="none" stroke="#f5c64b" stroke-width="6" stroke-linecap="round"/>
            <circle cx="190" cy="142" r="22" fill="#0d5aa7"/><path d="M179 142h22M190 131v22" stroke="#fff" stroke-width="4"/>
            <path d="M184 128c12-13 25-9 25 3 0 8-8 10-15 10" fill="none" stroke="#f5c64b" stroke-width="5"/>
          </g>
          <text x="230" y="92" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="900" fill="#fff">ACE</text>
          <text x="370" y="92" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="900" fill="url(#gold)">APSAN</text>
          <text x="232" y="127" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="1.3" fill="#dbeafe">ANGOLA COMUNIDADE EDUCATIVA</text>
          <text x="232" y="158" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2.4" fill="#f5c64b">APRENDER • EVOLUIR • CONQUISTAR</text>
          <g transform="translate(232 180)" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600">
            <text x="0">CURSOS</text><text x="74">PROFESSORES</text><text x="174">ALUNOS</text><text x="235">INSTITUIÇÕES</text><text x="345">MATERIAIS</text><text x="420">MÚSICA</text><text x="482">MARKETPLACE</text>
          </g>
          </svg>'''
          Path('assets/ace-apsan-logo.svg').write_text(svg, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '<title>APSAN, LDA. - Soluções Integradas</title>': '<title>ACE APSAN — Angola Comunidade Educativa APSAN</title>',
            'aria-label="APSAN, LDA. - Início"': 'aria-label="ACE APSAN — Início"',
            '<span class="lp-logo-mark"><i class="fa-solid fa-cube"></i></span>\n        <span><strong>APSAN</strong><small>, LDA.</small></span>': '<img src="assets/ace-apsan-logo.svg" alt="ACE APSAN — Angola Comunidade Educativa APSAN" class="ace-site-logo">',
            '<div><span>APSAN, LDA.</span><small>Acesso rápido à plataforma</small></div>': '<div><span>ACE APSAN</span><small>Angola Comunidade Educativa</small></div>',
            '<span><i class="fa-solid fa-flag"></i> APSAN, LDA. — Angola</span>': '<span><i class="fa-solid fa-graduation-cap"></i> ACE APSAN — Angola Comunidade Educativa</span>',
            '<span class="lp-dash-brand"><i class="fa-solid fa-layer-group" style="color:#6d28d9"></i> APSAN, LDA. · Portal digital</span>': '<span class="lp-dash-brand"><i class="fa-solid fa-graduation-cap" style="color:#d79b18"></i> ACE APSAN · Portal Educativo e Marketplace</span>'
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Não foi encontrada a marcação esperada: {old[:70]}')
            s = s.replace(old, new, 1)

          style = '''\n<style id="ace-apsan-logo-style">\n.ace-site-logo{width:min(300px,28vw);height:auto;display:block;max-height:58px;object-fit:contain;object-position:left center}\n@media(max-width:800px){.ace-site-logo{width:190px;max-width:58vw;max-height:50px}}\n</style>\n'''
          if 'id="ace-apsan-logo-style"' not in s:
            s = s.replace('</head>', style + '</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ace-apsan-logo.svg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "feat: aplicar logo ACE APSAN no site"
          git push

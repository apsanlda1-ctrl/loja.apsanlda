name: ACE APSAN Seller Registration Fix
on:
  push:
    branches: [main]
    paths:
      - ".seller-registration-fix"
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'fix: ativar correção de conta de vendedor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject seller registration fix
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/seller-registration-fix.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html sem </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: ativar correção de conta de vendedor'
          git push

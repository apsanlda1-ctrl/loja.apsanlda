name: APSAN Orchestra search fix
on:
  push:
    paths:
      - ".orchestra-search-fix"
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'APSAN: trigger orchestra search fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Orchestra search script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          tag='<script src="js/orchestra-search-fix.js"></script>'
          if tag not in t:
              if '</body>' not in t:
                  raise SystemExit('index.html sem </body>')
              t=t.replace('</body>',tag+'\n</body>',1)
              p.write_text(t,encoding='utf-8')
      - name: Commit and clean up
        run: |
          git config user.name "APSAN,LDA"
          git config user.email "apsanlda1@gmail.com"
          git add index.html js/orchestra-search-fix.js
          git rm .orchestra-search-fix .github/workflows/orchestra-search-fix.yml
          git commit -m "APSAN: integrar pesquisa da canção nº 5"
          git push

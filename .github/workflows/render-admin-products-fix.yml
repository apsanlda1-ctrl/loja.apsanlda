name: APSAN fix renderAdminProducts

on:
  push:
    paths:
      - ".render-admin-products-fix"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject renderer into marketplace
        shell: python
        run: |
          from pathlib import Path
          target=Path('js/marketplace.js')
          text=target.read_text(encoding='utf-8')
          marker='APSAN-render-admin-products-v1'
          if marker not in text:
              fix=Path('js/render-admin-products-fix.js').read_text(encoding='utf-8')
              needle='function renderAdmin(){'
              if needle not in text: raise SystemExit('renderAdmin insertion point not found')
              text=text.replace(needle,fix+'\n'+needle,1)
              target.write_text(text,encoding='utf-8')
              print('renderer injected')
          else:
              print('renderer already present')
      - name: Commit fix and clean temporary files
        run: |
          git config user.name "APSAN,LDA"
          git config user.email "apsanlda1@gmail.com"
          git rm .render-admin-products-fix .github/workflows/render-admin-products-fix.yml js/render-admin-products-fix.js
          git add js/marketplace.js
          git commit -m "APSAN: corrigir renderização de produtos no admin"
          git push

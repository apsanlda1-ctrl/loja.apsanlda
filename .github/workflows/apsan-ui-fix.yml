name: APSAN temporary UI fix

on:
  push:
    paths:
      - ".apsan-ui-fix"

permissions:
  contents: write

jobs:
  apply-ui-fix:
    if: github.event.head_commit.message == 'APSAN: trigger responsive UI fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply responsive admin UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          if "apsan-responsive-admin-ui-v1" in text:
              print("UI fix already present")
              raise SystemExit(0)

          css = r'''<style id="apsan-responsive-admin-ui-v1">
          /* APSAN — ajuste visual responsivo do painel administrativo */
          .admin-pro-shell{min-width:0!important}
          .admin-pro-sidebar{width:248px!important;flex-basis:248px!important;padding:18px 13px!important}
          .admin-pro-main{padding:24px 28px 44px!important}
          .admin-pro-nav-btn{min-height:44px!important}
          .admin-pro-nav-btn.active{background:linear-gradient(135deg,#6d28d9,#7c3aed)!important}
          .admin-pro-main .admin-pro-section-title h2{letter-spacing:-.35px}
          .admin-pro-overview-card,.admin-pro-kpi{transition:transform .18s ease,box-shadow .18s ease}
          .admin-pro-overview-card:hover,.admin-pro-kpi:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,23,42,.07)}
          .apsan-mobile-menu-btn{display:none}
          .apsan-mobile-overlay{display:none}

          @media(max-width:900px){
            .admin-pro-shell{display:block!important;background:#f5f7fb!important}
            .admin-pro-sidebar{
              position:fixed!important;z-index:1200!important;left:0!important;top:0!important;bottom:0!important;
              width:min(310px,86vw)!important;height:100vh!important;min-height:100vh!important;
              transform:translateX(-105%)!important;transition:transform .24s ease!important;
              box-shadow:18px 0 45px rgba(15,23,42,.18)!important;overflow-y:auto!important;
              padding:18px 14px!important;
            }
            .admin-pro-shell.apsan-menu-open .admin-pro-sidebar{transform:translateX(0)!important}
            .admin-pro-main{width:100%!important;max-width:none!important;padding:18px 14px 34px!important}
            .admin-pro-topbar{padding-top:48px!important;position:relative!important;margin-bottom:18px!important}
            .admin-pro-topbar h1{font-size:25px!important;line-height:1.15!important}
            .admin-pro-top-actions{flex-wrap:wrap!important}
            .admin-pro-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
            .admin-pro-overview-grid{grid-template-columns:1fr!important}
            .admin-global-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            .admin-pro-shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            .admin-pro-card-head{align-items:flex-start!important}
            .admin-pro-view .admin-table-wrap,.admin-pro-view .on-v2-table-wrap{max-width:100%!important}
            .admin-pro-sidebar .admin-pro-nav{display:flex!important;gap:6px!important}
            .admin-pro-sidebar .admin-pro-nav-btn{flex-direction:row!important;justify-content:flex-start!important;font-size:12px!important;padding:10px 11px!important}
            .admin-pro-sidebar .admin-pro-nav-btn i{width:20px!important}
            .admin-pro-sidebar .admin-pro-nav-btn b{display:grid!important}
            .apsan-mobile-menu-btn{
              display:flex!important;position:absolute!important;left:0!important;top:0!important;width:42px!important;height:42px!important;
              align-items:center!important;justify-content:center!important;border:1px solid #e2e8f0!important;background:#fff!important;
              color:#334155!important;border-radius:12px!important;box-shadow:0 5px 16px rgba(15,23,42,.07)!important;
              cursor:pointer!important;font-size:17px!important;z-index:10!important;
            }
            .apsan-mobile-overlay{
              position:fixed!important;inset:0!important;z-index:1100!important;background:rgba(8,18,36,.42)!important;
              backdrop-filter:blur(2px)!important;display:none!important;
            }
            .admin-pro-shell.apsan-menu-open .apsan-mobile-overlay{display:block!important}
            .admin-pro-shell.apsan-menu-open{overflow:hidden!important}
          }

          @media(max-width:520px){
            .admin-pro-main{padding:14px 10px 28px!important}
            .admin-pro-topbar{padding-top:50px!important}
            .admin-pro-topbar h1{font-size:22px!important}
            .admin-pro-topbar p{font-size:12px!important;line-height:1.5!important}
            .admin-pro-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            .admin-pro-kpi{padding:13px!important;border-radius:13px!important}
            .admin-pro-kpi strong{font-size:21px!important}
            .admin-pro-overview-card{padding:15px!important;border-radius:14px!important}
            .admin-pro-shortcuts{grid-template-columns:1fr!important}
            .admin-global-grid{grid-template-columns:1fr 1fr!important}
            .admin-global-card{padding:13px!important}
            .admin-pro-section-title{display:block!important}
            .admin-pro-section-title h2{font-size:19px!important}
            .admin-pro-section-title p{margin-top:4px!important}
          }
          </style>'''

          js = r'''<script id="apsan-responsive-admin-ui-js">
          (()=>{
            const init=()=>{
              const shell=document.querySelector('.admin-pro-shell');
              const sidebar=document.querySelector('.admin-pro-sidebar');
              const main=document.querySelector('.admin-pro-main');
              if(!shell||!sidebar||!main||document.querySelector('.apsan-mobile-menu-btn')) return;
              const btn=document.createElement('button');
              btn.className='apsan-mobile-menu-btn';
              btn.type='button';
              btn.setAttribute('aria-label','Abrir menu administrativo');
              btn.setAttribute('aria-expanded','false');
              btn.innerHTML='<i class="fa-solid fa-bars"></i>';
              const overlay=document.createElement('div');
              overlay.className='apsan-mobile-overlay';
              main.prepend(btn);
              shell.appendChild(overlay);
              const close=()=>{shell.classList.remove('apsan-menu-open');btn.setAttribute('aria-expanded','false');btn.innerHTML='<i class="fa-solid fa-bars"></i>'};
              const open=()=>{shell.classList.add('apsan-menu-open');btn.setAttribute('aria-expanded','true');btn.innerHTML='<i class="fa-solid fa-xmark"></i>'};
              btn.addEventListener('click',()=>shell.classList.contains('apsan-menu-open')?close():open());
              overlay.addEventListener('click',close);
              sidebar.querySelectorAll('.admin-pro-nav-btn').forEach(el=>el.addEventListener('click',()=>{if(window.innerWidth<=900)close()}));
              window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
              window.addEventListener('resize',()=>{if(window.innerWidth>900)close()});
            };
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          </script>'''

          if "</head>" not in text or "</body>" not in text:
              raise SystemExit("index.html structure not recognized")

          text=text.replace("</head>",css+"\n</head>",1)
          text=text.replace("</body>",js+"\n</body>",1)
          path.write_text(text,encoding="utf-8")
          print("Responsive admin UI applied")

      - name: Commit UI fix and remove temporary workflow
        run: |
          git config user.name "APSAN,LDA"
          git config user.email "apsanlda1@gmail.com"
          git rm .apsan-ui-fix .github/workflows/apsan-ui-fix.yml
          git add index.html
          git commit -m "APSAN: aplicar ajuste visual responsivo ao painel"
          git push

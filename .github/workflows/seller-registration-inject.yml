name: ACE APSAN Seller Registration Fix
on:
  push:
    paths:
      - ".seller-registration-fix"
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'APSAN: ativar correcao vendedor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject seller registration and product type fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags = [
              '<script src="js/seller-registration-fix.js"></script>',
              '<script id="apsan-product-type-flow-script-v2" src="js/seller-product-type-flow.js?v=20260908b"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  if '</body>' not in s: raise SystemExit('index.html sem </body>')
                  s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'APSAN,LDA'
          git config user.email 'apsanlda1@gmail.com'
          git add index.html js/seller-registration-fix.js
          git rm .seller-registration-fix .github/workflows/seller-registration-inject.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'APSAN: corrigir criacao contas vendedor e fluxo de produtos'
          git push

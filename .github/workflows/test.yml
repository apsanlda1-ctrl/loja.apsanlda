name: Apply APSAN profile layer
on:
  push:
    paths:
      - '.github/workflows/test.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add profile layer to index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='    <script src="js/profile-sync.js"></script>\n'
          anchor='    <script src="js/dashboard.js"></script>\n'
          if 'js/profile-sync.js' not in s:
              if anchor not in s:
                  raise SystemExit('dashboard.js script tag not found')
              s=s.replace(anchor, anchor+tag, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit index
        shell: bash
        run: |
          git config user.name "APSAN Profile Repair"
          git config user.email "apsanlda1@gmail.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: load unified student teacher profiles"
          git push origin main

name: Deploy seller product type flow

on:
  push:
    paths:
      - "js/seller-product-type-flow.js"
      - "js/seller-registration-fix.js"
      - "js/buttons-fix.js"
      - "js/catalog-visual-v2.js"
      - ".github/workflows/deploy-seller-product-type.yml"

permissions:
  contents: write

jobs:
  inject-seller-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject seller flow and APSAN marketplace fixes into index
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          scripts = [
              ('apsan-product-type-flow-script-v2', 'js/seller-product-type-flow.js?v=20260908b'),
              ('apsan-buttons-fix-v1', 'js/buttons-fix.js?v=20260908d'),
              ('apsan-catalog-visual-v2', 'js/catalog-visual-v2.js?v=20260908e')
          ]

          additions = []
          for marker, src in scripts:
              if marker not in text:
                  additions.append(f'<script id="{marker}" src="{src}"></script>')

          if not additions:
              print("APSAN marketplace scripts already injected")
              raise SystemExit(0)

          if '</body>' not in text:
              raise SystemExit("index.html has no closing body tag")

          text = text.replace('</body>', '\n'.join(additions) + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          print("Injected:", ', '.join(additions))

      - name: Commit index update
        run: |
          git config user.name "APSAN,LDA"
          git config user.email "apsanlda1@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
            exit 0
          fi
          git commit -m "APSAN: ativar visual completo V2 do marketplace"
          git push

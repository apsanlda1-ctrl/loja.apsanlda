name: Deploy seller product type flow

on:
  push:
    paths:
      - "js/seller-product-type-flow.js"
      - "js/seller-registration-fix.js"
      - "js/buttons-fix.js"
      - "js/catalog-visual-v2.js"
      - "js/restore-existing-catalog.js"
      - ".github/workflows/deploy-seller-product-type.yml"

permissions:
  contents: write

jobs:
  inject-seller-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject seller flow and APSAN marketplace fixes into index
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          scripts = [
              ('apsan-product-type-flow-script-v2', 'js/seller-product-type-flow.js?v=20260908b'),
              ('apsan-buttons-fix-v1', 'js/buttons-fix.js?v=20260909a'),
              ('apsan-restore-existing-catalog-v1', 'js/restore-existing-catalog.js?v=20260909b'),
              ('apsan-catalog-visual-v2', 'js/catalog-visual-v2.js?v=20260909a')
          ]

          additions = []
          for marker, src in scripts:
              tag = f'<script id="{marker}" src="{src}"></script>'
              if marker not in text:
                  additions.append(tag)
              else:
                  import re
                  pattern = rf'<script id="{re.escape(marker)}"[^>]*></script>'
                  text = re.sub(pattern, tag, text, count=1)

          if additions:
              if '</body>' not in text:
                  raise SystemExit("index.html has no closing body tag")
              text = text.replace('</body>', '\n'.join(additions) + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          print("APSAN marketplace script markers refreshed")

      - name: Commit index update
        run: |
          git config user.name "APSAN,LDA"
          git config user.email "apsanlda1@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
            exit 0
          fi
          git commit -m "APSAN: atualizar cache e restaurar catálogo"
          git push

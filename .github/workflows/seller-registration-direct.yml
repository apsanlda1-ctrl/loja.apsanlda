name: ACE APSAN Seller Registration Direct Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject seller registration script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/seller-registration-fix.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html sem </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit injection and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'APSAN,LDA'
          git config user.email 'apsanlda1@gmail.com'
          git add index.html
          git rm .github/workflows/seller-registration-direct.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: carregar correcao de conta de vendedor'
          git push

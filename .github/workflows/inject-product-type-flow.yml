name: APSAN activate marketplace publication fixes

on:
  push:
    paths:
      - ".apsan-product-type-flow-trigger-v2"

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject required marketplace scripts
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          scripts=[
              ('apsan-product-type-flow-script-v1','js/seller-product-type-flow.js'),
              ('apsan-product-publication-fix-v1','js/product-publication-fix.js'),
              ('apsan-marketplace-approval-flow-v1','js/marketplace-auto-publish.js'),
              ('apsan-admin-orders-fallback-v1','js/admin-orders-fallback.js')
          ]
          additions=[]
          for marker,src in scripts:
              if marker not in text:
                  additions.append(f'<script id="{marker}" src="{src}"></script>')
          if additions:
              if '</body>' not in text:
                  raise SystemExit('index.html structure not recognized')
              text=text.replace('</body>','\n'.join(additions)+'\n</body>',1)
              path.write_text(text,encoding='utf-8')
              print('Injected:', ', '.join(additions))
          else:
              print('All marketplace scripts already present')

      - name: Remove trigger and commit
        run: |
          git config user.name "APSAN,LDA"
          git config user.email "apsanlda1@gmail.com"
          git rm -f .apsan-product-type-flow-trigger-v2 || true
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "APSAN: corrigir publicação e aprovação de produtos"
          git push

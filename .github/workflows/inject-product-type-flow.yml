name: APSAN inject product type flow

on:
  push:
    paths:
      - ".apsan-product-type-flow-trigger-v2"

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject product type script
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          marker='apsan-product-type-flow-script-v1'
          if marker not in text:
              script='<script id="'+marker+'" src="js/seller-product-type-flow.js"></script>'
              if '</body>' not in text:
                  raise SystemExit('index.html structure not recognized')
              text=text.replace('</body>',script+'\n</body>',1)
              path.write_text(text,encoding='utf-8')
              print('Product type flow injected')
          else:
              print('Product type flow already present')

      - name: Remove trigger and commit
        run: |
          git config user.name "APSAN,LDA"
          git config user.email "apsanlda1@gmail.com"
          git rm -f .apsan-product-type-flow-trigger-v2 || true
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "APSAN: ativar escolha inicial digital ou físico"
          git push

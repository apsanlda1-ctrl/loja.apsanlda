<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APSAN, LDA. - Portal de Vendas e Serviços</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Incorporado para garantir que o estilo carregue no GitHub Pages -->
    <style>
        /* --- RESET E ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
            padding-top: 80px; /* Espaço para a navbar fixa */
        }

        /* --- CABEÇALHO (NAVBAR) --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(11, 15, 25, 0.95);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: #a855f7;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #94a3b8;
            font-size: 1rem;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
        }

        .btn-login {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #a855f7;
            border-color: #a855f7;
        }

        /* --- SISTEMA DE ECRÃS (TELAS) --- */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            min-height: calc(100vh - 80px);
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        /* --- TELA 1: HOME / INSTITUCIONAL --- */
        .hero {
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            position: relative;
            background: linear-gradient(135deg, #0b0f19 0%, #121829 100%);
        }

        .hero-content {
            max-width: 600px;
            z-index: 2;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.2;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-cta {
            background: transparent;
            border: 2px solid #a855f7;
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-cta:hover {
            background: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        /* Elementos Visuais de Fundo (Ondas) */
        .hero-graphic {
            position: absolute;
            right: 0;
            top: 0;
            width: 55%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .wave-shape-1, .wave-shape-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }

        .wave-shape-1 {
            width: 400px;
            height: 400px;
            background: #a855f7;
            top: 20%;
            right: 10%;
        }

        .wave-shape-2 {
            width: 350px;
            height: 350px;
            background: #06b6d4;
            bottom: 10%;
            right: 30%;
        }

        /* Seções Gerais */
        .section {
            padding: 80px 50px;
            text-align: center;
        }

        .dark-bg {
            background-color: #070911;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .section p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .info-fiscal {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1rem;
            color: #06b6d4;
        }

        /* Grid de Ícones */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .icon-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 12px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .icon-card:hover {
            transform: translateY(-5px);
            border-color: #a855f7;
        }

        .icon-card i {
            font-size: 2.5rem;
            color: #06b6d4;
            margin-bottom: 20px;
        }

        .contact-info {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- TELA 2 & 3: FORMULÁRIOS --- */
        .form-screen {
            display: flex;
            justify-content: center;
            align-items: start;
            padding-top: 50px;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
            background: #121829;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }

        .form-container.wide {
            max-width: 700px;
        }

        .form-container h2 {
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .form-container p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0b0f19;
            color: #ffffff;
            font-size: 1rem;
            width: 100%;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #a855f7;
        }

        .input-group small {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: -5px;
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-action {
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            border: none;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-primary {
            background: #a855f7;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #9333ea;
        }

        .btn-success {
            background: #06b6d4;
            color: #0b0f19;
        }

        .btn-success:hover {
            background: #0891b2;
            color: #ffffff;
        }

        /* --- RODAPÉ --- */
        footer {
            padding: 30px;
            text-align: center;
            background: #05070d;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        /* --- RESPONSIVIDADE (Mobile) --- */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }
            .nav-links {
                display: none; /* Oculta links em telas pequenas (pode melhorar depois) */
            }
            .hero {
                padding: 0 20px;
                flex-direction: column;
                justify-content: center;
                height: auto;
                min-height: 80vh;
            }
            .hero-content {
                margin-top: 100px;
            }
            .hero-content h1 {
                font-size: 2.5rem;
            }
            .hero-graphic {
                width: 100%;
                height: 50%;
                bottom: 0;
                top: auto;
            }
            .wave-shape-1, .wave-shape-2 {
                width: 250px;
                height: 250px;
                filter: blur(50px);
            }
            .section {
                padding: 60px 20px;
            }
            .section h2 {
                font-size: 2rem;
            }
            .info-fiscal {
                flex-direction: column;
                gap: 10px;
            }
            .row-inputs {
                grid-template-columns: 1fr;
            }
            .form-container {
                padding: 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>

            </div>
        </section>
